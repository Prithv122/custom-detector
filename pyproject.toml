[project]
name = "custom-detector"
version = "0.1.0"
description = "Weightlifting-plate detector: audited public dataset (Roboflow, CC BY 4.0), leakage-free re-split, RF-DETR-S fine-tuned on Kaggle."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imagehash>=4.3",
    "numpy>=2",
    "pillow>=11",
    "python-dotenv>=1",
    "roboflow>=1.5.0",
]

# Most projects here ship a CLI. Entry points REQUIRE a real build backend â€”
# a uv virtual project ([tool.uv] package = false) installs nothing, so the
# documented command fails with "No module named ..." even while tests pass
# (pytest's pythonpath hides it). Bit us on A1, nearly again on A3.
# No-CLI projects (static sites, notebooks-only): delete [project.scripts];
# the build backend is harmless to keep.
[project.scripts]
custom-detector = "detector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# âš ï¸ When /new-project renames src/app, update BOTH the line below AND the
# [project.scripts] target above.
[tool.hatch.build.targets.wheel]
packages = ["src/detector"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
